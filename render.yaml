services:
  - type: web
    name: placement-tracker
    runtime: python
    region: oregon
    plan: free
    buildCommand: npm --prefix client install && npm --prefix client run build && pip install -r server/requirements.txt
    startCommand: gunicorn --chdir server wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: Placement_Tracker
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.0"
